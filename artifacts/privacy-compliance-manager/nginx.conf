# M12 — nginx: SPA fallback a index.html + proxy /api al backend.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # M18 Fase 7 — cabeceras de seguridad del frontal (la API ya las aporta vía
  # helmet; el SPA estático las necesita en su propio servidor).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # CSP mínimo seguro para SPA: sin embedding externo ni base-uri abierta.
  # (script-src no se restringe aquí para no romper el bundle de Vite).
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'" always;

  # M20.2-B — probe propio del frontal: /healthz local, sin tocar la API.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # M20.2-B — probes: GET /healthz (local, propio del frontal) para el
  # healthcheck de `web`; GET /api/livez y GET /api/readyz siguen siendo los
  # probes oficiales del API (liveness / readiness fail-closed).
}
