name: Product quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Product gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck libraries
        run: pnpm run typecheck:libs

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Typecheck frontend
        run: pnpm --filter @workspace/privacy-compliance-manager run typecheck

      - name: Build API and frontend
        run: pnpm run build:product

      - name: Test API
        run: pnpm --filter @workspace/api-server run test

      - name: Test frontend
        run: pnpm --filter @workspace/privacy-compliance-manager run test

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high

  connectors-integration:
    name: Connector integration (PostgreSQL + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      M24_CI_PROJECT: m24-connectors-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run real connector integration tests
        run: bash scripts/ci/run-connectors-integration.sh
