# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. Replit packsges, react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # Exclude @replit scoped packages from the minimum release age check.
  # These are published by Replit and trusted — the supply-chain attack vector
  # this setting guards against does not apply to our own packages.
  - '@replit/*'
  - stripe-replit-sync

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  # GHSA-587h-7wmj-h5pm: vite 7.0.0-7.3.6 (que empaqueta launch-editor) es
  # vulnerable en Windows; 7.3.7 es la version parcheada de la linea 7.x.
  vite: ^7.3.7
  wouter: ^3.3.5
  zod: ^4.6.7

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # NOTE: platform-specific binary exclusions (esbuild/rollup/lightningcss/@tailwindcss/oxide)
  # were removed so the workspace installs on Windows and macOS as well.
  # These packages ship their native binaries as optionalDependencies with os/cpu fields,
  # so pnpm already only downloads the binary matching the current platform.
  # linux-x64 (Replit) resolution is unchanged.
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.28.1"
  # Security-only transitive pins required by the high/critical audit gate.
  # Keep these aligned with the patched versions reported by pnpm audit.
  "fast-uri": "3.1.8"
  "brace-expansion": "5.0.12"
  "js-yaml": "4.3.2"
  "nanoid": "3.3.18"
  # GHSA-27r3-jxmh-p828: body-parser 2.0.0-2.3.x termina el proceso con bytes
  # sobrantes tras un cuerpo comprimido. express@5 declara ^2.2.1, asi que 2.4.0
  # entra sin cambio de version mayor.
  "body-parser": "2.4.0"
  # GHSA-gfr2-rv44-r23c: markdown-it 14.1.0-14.3.2 renderiza en tiempo cuadratico.
  # Llega transitivo via orval>typedoc, que declara ^14.3.0.
  "markdown-it": "14.3.3"
  # GHSA-xjj6-f33q-929c: undici 8.0.0-8.12.1 muere por exceso de content-encodings.
  # Llega transitivo via jsdom, que declara ^8.9.0. El override va ACOTADO a jsdom
  # para no alterar la instancia independiente de @scalar/json-magic (ver abajo).
  "jsdom>undici": "8.12.2"
  # GHSA-xjj6-f33q-929c: la instancia 7.x de @scalar/json-magic tambien esta en el
  # rango vulnerable (7.18.0-7.30.0); se sube a la parcheada para que una futura
  # materializacion no reintroduzca el aviso.
  "@scalar/json-magic>undici": "7.30.1"
  # GHSA-587h-7wmj-h5pm: vitest declara vite ^6||^7||^8 (dependencia directa y
  # peer opcional de @vitest/mocker) y pnpm conservaba la resolucion ya
  # bloqueada 7.3.6. El catalogo no alcanza esa ruta porque artifacts/api-server
  # no declara vite; se fija el borde vitest>vite a la version parcheada.
  "vitest>vite": "7.3.7"

  # qs llega transitivo via supertest>superagent, cuyo rango ^6.14.1 ya admite
  # 6.16.0; el override solo sube a la version parcheada (GHSA-x5fp-wj9c-mxmx).
  "qs": "6.16.0"

# pnpm >= 11 build-script approval (replaces onlyBuiltDependencies there).
# esbuild is trusted in this workspace: it is pinned to 0.28.1 via `overrides`
# and already allowlisted for pnpm <= 10 via `onlyBuiltDependencies`.
allowBuilds:
  esbuild: true
