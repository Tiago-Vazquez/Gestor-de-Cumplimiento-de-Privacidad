openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session
  - name: users
    description: User administration (admin role required)
  - name: dashboard
    description: Overview and activity
  - name: findings
    description: Sensitive data findings
  - name: sources
    description: Connected data sources
  - name: rules
    description: Detection rules
  - name: reports
    description: Audit reports
  - name: masking
    description: Test data anonymization
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Login with local credentials (email + password) or legacy bootstrap token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Authenticated (session cookie set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid request body
        "401":
          description: Invalid credentials (uniform response, no account enumeration)
        "429":
          description: Too many login attempts (rate limited, local login only)
  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      summary: Register a new local user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created (auditor role assigned; not logged in automatically)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input (email format or password policy)
        "409":
          description: Email already registered
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Logout (clears session cookie)
      security: []
      responses:
        "204":
          description: Session cleared
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get authenticated user identity
      responses:
        "200":
          description: Authenticated user identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin only)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Safe user list (no credentials)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
        "403":
          description: Admin role required
  /users/{sub}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a single user (admin only)
      parameters:
        - name: sub
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401": { description: Not authenticated }
        "403": { description: Admin role required }
        "404": { description: User not found }
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update admin-editable fields (email, name). `sub` is immutable (admin only)
      parameters:
        - name: sub
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { description: Invalid input }
        "401": { description: Not authenticated }
        "403": { description: Admin role required }
        "404": { description: User not found }
        "409": { description: Email already in use }
  /users/{sub}/roles:
    patch:
      operationId: updateUserRoles
      tags: [users]
      summary: Replace user roles (admin only, backend-authoritative)
      description: |
        Replaces the role set of a user. Removing the `admin` role from the
        last administrator is rejected with 403 to avoid lock-out.
      parameters:
        - name: sub
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolesUpdateInput"
      responses:
        "200":
          description: Updated user with applied roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { description: Invalid roles }
        "401": { description: Not authenticated }
        "403": { description: Admin role required / would remove last admin }
        "404": { description: User not found }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get compliance dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Get recent compliance activity
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /findings:
    get:
      operationId: listFindings
      tags: [findings]
      summary: List privacy findings
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in_review, resolved]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Finding"
  /findings/{id}:
    patch:
      operationId: updateFinding
      tags: [findings]
      summary: Update a finding status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingUpdate"
      responses:
        "200":
          description: Updated finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "404":
          description: Finding not found
  /sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: List monitored data sources
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSource"
    post:
      operationId: createSource
      tags: [sources]
      summary: Create a data source
      description: >-
        Admin only. The connection password is WRITE-ONLY: it is encrypted at
        rest and never returned in any response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceCreate"
      responses:
        "201":
          description: Created data source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "400":
          description: Invalid body
  /sources/{id}:
    get:
      operationId: getSource
      tags: [sources]
      summary: Get a data source by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Data source detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "404":
          description: Source not found
    patch:
      operationId: updateSource
      tags: [sources]
      summary: Update a data source
      description: >-
        Admin only. Update a data source's metadata or store a new connection
        configuration (encrypted). Password remains write-only on update as
        well.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceUpdate"
      responses:
        "200":
          description: Updated data source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "404":
          description: Source not found
    delete:
      operationId: deleteSource
      tags: [sources]
      summary: Delete a data source
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Source deleted
        "404":
          description: Source not found
  /rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List detection rules
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Detection rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
  /scans:
    get:
      operationId: listScans
      tags: [sources]
      summary: List scan history
      description: >-
        Scan executions, newest first. `status=queued` is accepted but never
        returned (no scan is ever created in queued state).
      parameters:
        - name: sourceId
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [queued, running, completed, failed] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Scan history (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"
    post:
      operationId: startScan
      tags: [sources]
      summary: Start a privacy scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "202":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "409":
          description: A scan is already running for this source
  /scans/{id}:
    get:
      operationId: getScan
      tags: [sources]
      summary: Get one scan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scan detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Scan not found
  /rules/{id}:
    patch:
      operationId: updateRule
      tags: [rules]
      summary: Update a detection rule (admin only)
      description: |
        FASE 7.0.5: actualiza únicamente el campo `enabled` de una regla.
        Solo este campo es gobernable desde la API; el resto (patrón, severidad,
        regulación) es built-in. El cambio es efectivo en el siguiente scan.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: Invalid input
        "401":
          description: Authentication required
        "403":
          description: Admin role required
        "404":
          description: Rule not found
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List audit reports
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Audit reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Generate an audit report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /masking/preview:
    post:
      operationId: previewMasking
      tags: [masking]
      summary: Preview anonymization for test data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaskingInput"
      responses:
        "200":
          description: Masked data preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaskingPreview"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthLoginInput:
      oneOf:
        - $ref: "#/components/schemas/BootstrapLoginInput"
        - $ref: "#/components/schemas/LocalLoginInput"
    BootstrapLoginInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
    LocalLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: User email (normalized to lowercase server-side)
        password: { type: string, minLength: 1 }
    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: User email (normalized to lowercase server-side)
        password: { type: string, minLength: 12 }
        name: { type: string }
    AuthUser:
      type: object
      required: [sub, roles]
      properties:
        sub: { type: string }
        email: { type: ["string", "null"] }
        roles:
          type: array
          items: { type: string }
    AdminUser:
      type: object
      description: Safe projection for administration (never includes credentials)
      required: [sub, email, roles, createdAt]
      properties:
        sub: { type: string }
        email: { type: string }
        name: { type: ["string", "null"] }
        roles:
          type: array
          items: { type: string, enum: [admin, auditor] }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: ["string", "null"], format: date-time }
    UserUpdateInput:
      type: object
      description: Only email and name are admin-editable; sub is immutable
      properties:
        email:
          type: string
          description: New email (normalized to lowercase server-side)
        name: { type: ["string", "null"] }
    RolesUpdateInput:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string, enum: [admin, auditor] }
          description: Full replacement set; roles are backend-authoritative
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required: [complianceScore, openFindings, criticalFindings, protectedRecords, monitoredSources, lastScanAt, scanStatus, findingsBySeverity]
      properties:
        complianceScore: { type: number }
        openFindings: { type: number }
        criticalFindings: { type: number }
        protectedRecords: { type: number }
        monitoredSources: { type: number }
        lastScanAt: { type: string }
        scanStatus: { type: string, enum: [monitoring, scanning, paused] }
        findingsBySeverity:
          type: object
          required: [critical, high, medium, low]
          properties:
            critical: { type: number }
            high: { type: number }
            medium: { type: number }
            low: { type: number }
    Activity:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [finding, scan, masking, report, system] }
        title: { type: string }
        description: { type: string }
        createdAt: { type: string }
        severity: { type: ["string", "null"], enum: [critical, high, medium, low, null] }
    Finding:
      type: object
      required: [id, title, dataType, source, location, severity, status, records, detectedAt, regulation, recommendation]
      properties:
        id: { type: string }
        title: { type: string }
        dataType: { type: string, enum: [email, phone, national_id, credit_card, health, address, password] }
        source: { type: string }
        location: { type: string }
        severity: { type: string, enum: [critical, high, medium, low] }
        status: { type: string, enum: [open, in_review, resolved] }
        records: { type: number }
        detectedAt: { type: string }
        regulation: { type: string }
        recommendation: { type: string }
        sample: { type: ["string", "null"] }
    FindingUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, in_review, resolved] }
    DataSource:
      type: object
      required: [id, name, kind, environment, status, lastScanAt, tables, records, findings]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [postgresql, mysql, mongodb, snowflake, bigquery] }
        environment: { type: string, enum: [production, staging, development] }
        status: { type: string, enum: [healthy, warning, offline] }
        lastScanAt: { type: string }
        tables: { type: number }
        records: { type: number }
        findings: { type: number }
    SourceConnectionInput:
      type: object
      description: >-
        Database connection credentials for an external source. The password is
        write-only: it is encrypted at rest and never returned in any response.
      required: [host, port, database, user, password]
      properties:
        host:
          type: string
          description: Database host (hostname or IP)
          minLength: 1
          maxLength: 253
        port:
          type: integer
          description: Database port (1-65535)
          minimum: 1
          maximum: 65535
        database:
          type: string
          description: Database name
          minLength: 1
          maxLength: 128
        user:
          type: string
          description: Username for authentication
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          description: Password (write-only, never returned in responses)
          minLength: 1
          maxLength: 256
        schema:
          type: string
          description: Database schema (optional)
          maxLength: 128
    SourceCreate:
      type: object
      required: [name, kind, environment]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          enum: [postgresql, mysql, mongodb, snowflake, bigquery]
        environment:
          type: string
          enum: [production, staging, development]
        connection:
          $ref: "#/components/schemas/SourceConnectionInput"
          description: >-
            Optional connection credentials. When omitted, the source is
            created without credentials (connectionConfig = null) and is not
            scannable until configuration is provided via PATCH.
    SourceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          enum: [postgresql, mysql, mongodb, snowflake, bigquery]
        environment:
          type: string
          enum: [production, staging, development]
        connection:
          $ref: "#/components/schemas/SourceConnectionInput"
          description: >-
            New connection configuration to store (encrypted). Omit to keep the
            existing configuration.
    SourceDetail:
      type: object
      required: [id, name, kind, environment, status, lastScanAt, tables, records, findings, scannable]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        environment: { type: string }
        status: { type: string }
        lastScanAt: { type: ["string", "null"] }
        tables: { type: number }
        records: { type: number }
        findings: { type: number }
        scannable:
          type: boolean
          description: Whether this source has connection configuration and can be scanned
    Rule:
      type: object
      required: [id, name, category, regulation, enabled, detections, lastTriggered]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        regulation: { type: string }
        enabled: { type: boolean }
        detections: { type: number }
        lastTriggered: { type: string }
    RuleInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
      description: |
        FASE 7.0.5: solo el campo `enabled` es gobernable desde la API.
        El resto (patrón, severidad, regulación) es built-in.
    ScanInput:
      type: object
      required: [sourceId]
      properties:
        sourceId: { type: string }
    Scan:
      type: object
      required: [id, sourceId, status, startedAt, tablesScanned, recordsRead]
      properties:
        id: { type: string }
        sourceId: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        startedAt: { type: string }
        completedAt: { type: ["string", "null"] }
        findingsCreated: { type: number }
        tablesScanned: { type: number }
        recordsRead: { type: number }
    ReportInput:
      type: object
      required: [name, period]
      properties:
        name: { type: string }
        period: { type: string, enum: [last_24h, last_7d, last_30d, quarter] }
    Report:
      type: object
      required: [id, name, period, status, createdAt, findings, complianceScore]
      properties:
        id: { type: string }
        name: { type: string }
        period: { type: string }
        status: { type: string, enum: [generating, ready] }
        createdAt: { type: string }
        findings: { type: number }
        complianceScore: { type: number }
        format: { type: string, enum: [pdf, csv] }
    MaskingInput:
      type: object
      required: [sourceId, fields]
      properties:
        sourceId: { type: string }
        fields:
          type: array
          items: { type: string }
    MaskingPreview:
      type: object
      required: [sourceId, records, maskedFields, rows]
      properties:
        sourceId: { type: string }
        records: { type: number }
        maskedFields:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type: string

