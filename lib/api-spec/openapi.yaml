openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session
  - name: users
    description: User administration (admin role required)
  - name: audit
    description: Administrative audit trail (admin role required)
  - name: dashboard
    description: Overview and activity
  - name: findings
    description: Sensitive data findings
  - name: sources
    description: Connected data sources
  - name: rules
    description: Detection rules
  - name: reports
    description: Audit reports
  - name: masking
    description: Test data anonymization
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Login with local credentials (email + password) or legacy bootstrap token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Authenticated (session cookie set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid request body
        "401":
          description: Invalid credentials (uniform response, no account enumeration)
        "429":
          description: Too many login attempts (rate limited, local login only)
  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      summary: Register a new local user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created (auditor role assigned; not logged in automatically)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input (email format or password policy)
        "409":
          description: Email already registered
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Logout (clears session cookie)
      security: []
      responses:
        "204":
          description: Session cleared
  /auth/password/change:
    post:
      operationId: authPasswordChange
      tags: [auth]
      summary: Change own password (revokes all other active sessions; current session stays valid)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password changed; other sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  # `type: number` (no `integer`): el generador de Zod del
                  # workspace emite API de Zod 4 (`zod.int()`) para `integer`
                  # en bodies, y el runtime instalado es Zod 3. El servidor
                  # sigue devolviendo un entero (conteo de sesiones revocadas).
                  revokedSessions: { type: number, minimum: 0 }
        "400":
          description: Invalid request (missing fields, password policy or account without local password)
        "401":
          description: Not authenticated or current password incorrect
        "403":
          description: Missing/invalid CSRF token (cookie-based sessions)
        "429":
          description: Too many password change attempts (rate limited)
  /auth/sessions:
    get:
      operationId: authListSessions
      tags: [auth]
      summary: List own active sessions
      description: Returns metadata (jti, createdAt, expiresAt, current) of all active sessions for the authenticated user. Never exposes CSRF tokens or secrets.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: Not authenticated
  /auth/sessions/{jti}:
    delete:
      operationId: authRevokeSession
      tags: [auth]
      summary: Revoke one own session
      description: Revokes a single session by jti. Returns 404 (not 403) for non-existent, already-revoked, or other users' sessions to prevent enumeration. Revoking the current session is allowed.
      security:
        - cookieAuth: []
      parameters:
        - name: jti
          in: path
          required: true
          # Sin `format: uuid`: el generador emitiría `zod.uuid()` (Zod 4) y el
          # runtime instalado es Zod 3. El jti sigue siendo un UUID validado en
          # la capa de dominio.
          schema: { type: string }
          description: Session allowlist identifier (jti, UUID).
      responses:
        "200":
          description: Session revoked (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean, example: true }
        "401":
          description: Not authenticated
        "403":
          description: Missing/invalid CSRF token (cookie-based sessions)
        "404":
          description: Session not found or does not belong to current user
  /auth/logout-all:
    post:
      operationId: authLogoutAll
      tags: [auth]
      summary: Revoke all own sessions (including current)
      description: Revokes every active session of the authenticated user. The current session becomes invalid for subsequent requests (401 via allowlist). Other users' sessions are unaffected.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: number, minimum: 0 }
        "401":
          description: Not authenticated
        "403":
          description: Missing/invalid CSRF token (cookie-based sessions)
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get authenticated user identity
      responses:
        "200":
          description: Authenticated user identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin only)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Safe user list (no credentials)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
        "403":
          description: Admin role required
  /users/{sub}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a single user (admin only)
      parameters:
        - name: sub
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401": { description: Not authenticated }
        "403": { description: Admin role required }
        "404": { description: User not found }
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update admin-editable fields (email, name). `sub` is immutable (admin only)
      parameters:
        - name: sub
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { description: Invalid input }
        "401": { description: Not authenticated }
        "403": { description: Admin role required }
        "404": { description: User not found }
        "409": { description: Email already in use }
  /users/{sub}/roles:
    patch:
      operationId: updateUserRoles
      tags: [users]
      summary: Replace user roles (admin only, backend-authoritative)
      description: |
        Replaces the role set of a user. Removing the `admin` role from the
        last administrator is rejected with 403 to avoid lock-out.
      parameters:
        - name: sub
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolesUpdateInput"
      responses:
        "200":
          description: Updated user with applied roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { description: Invalid roles }
        "401": { description: Not authenticated }
        "403": { description: Admin role required / would remove last admin }
        "404": { description: User not found }
  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List administrative audit events (admin only)
      description: >-
        Trazabilidad administrativa (M17), eventos más recientes primero. Solo
        rol `admin` (403 para cualquier otro rol). Filtros opcionales
        combinables; la consulta SIEMPRE está paginada (limit/offset aplicados
        en SQL) y nunca devuelve la tabla completa. `metadata` contiene
        exclusivamente información operacional segura: nunca contraseñas, JWT,
        cookies, tokens CSRF, claves de cifrado ni credenciales de conexión.
      security:
        - bearerAuth: []
      parameters:
        - name: actor
          in: query
          required: false
          schema: { type: string }
          description: actor_user_id exacto (sub del actor autenticado).
        - name: action
          in: query
          required: false
          schema: { type: string }
          description: Acción exacta (p. ej. login_success, source_created).
        - name: resourceType
          in: query
          required: false
          schema: { type: string }
          description: Tipo de recurso exacto (session, source, scan, user, rule, report, masking_job, schedule).
        - name: resourceId
          in: query
          required: false
          schema: { type: string }
          description: Identificador exacto del recurso afectado.
        - name: result
          in: query
          required: false
          schema: { type: string, enum: [success, failure] }
        - name: from
          in: query
          required: false
          schema: { type: string }
          description: Límite inferior inclusivo, ISO-8601 (comparado contra created_at). Valor inválido → 400.
        - name: to
          in: query
          required: false
          schema: { type: string }
          description: Límite superior inclusivo, ISO-8601. Valor inválido → 400.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Audit events (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "400":
          description: Invalid filter (malformed date, unknown result, out-of-range limit/offset)
        "401":
          description: Not authenticated
        "403":
          description: Admin role required
  /audit-events/platform:
    get:
      operationId: listAuditEventsPlatform
      tags: [audit]
      summary: List platform administrative audit events (admin only)
      description: >-
        Trazabilidad administrativa de PLATAFORMA (M21.7.3). Devuelve
        exclusivamente eventos con `tenant_id` NULL (acciones de plataforma y
        eventos de sistema sin organización). Solo rol global `admin`; NO
        requiere organización activa. Filtros opcionales combinables; consulta
        SIEMPRE paginada (limit/offset en SQL). Conjunto disjunto de
        `GET /api/audit-events` (org-scoped).
      security:
        - bearerAuth: []
      parameters:
        - name: actor
          in: query
          required: false
          schema: { type: string }
          description: actor_user_id exacto (sub del actor autenticado).
        - name: action
          in: query
          required: false
          schema: { type: string }
          description: Acción exacta (p. ej. user_roles_updated, rule_enabled).
        - name: resourceType
          in: query
          required: false
          schema: { type: string }
          description: Tipo de recurso exacto (session, user, rule, ...).
        - name: resourceId
          in: query
          required: false
          schema: { type: string }
          description: Identificador exacto del recurso afectado.
        - name: result
          in: query
          required: false
          schema: { type: string, enum: [success, failure] }
        - name: from
          in: query
          required: false
          schema: { type: string }
          description: Límite inferior inclusivo, ISO-8601. Valor inválido → 400.
        - name: to
          in: query
          required: false
          schema: { type: string }
          description: Límite superior inclusivo, ISO-8601. Valor inválido → 400.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Platform audit events (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "400":
          description: Invalid filter (malformed date, unknown result, out-of-range limit/offset)
        "401":
          description: Not authenticated
        "403":
          description: Admin role required
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get compliance dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /compliance:
    get:
      operationId: getCompliance
      tags: [dashboard]
      summary: Get compliance metrics snapshot
      description: >-
        Aggregated compliance metrics computed from persisted findings and
        sources (canonical findings only: superseded rows are excluded).
        Computed on demand; no metric tables are involved.
      responses:
        "200":
          description: Compliance snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceSummary"
  /compliance/trend:
    get:
      operationId: getComplianceTrend
      tags: [dashboard]
      summary: Get compliance trend for the last N days
      description: >-
        Daily event-based metrics (UTC calendar days) for the last `days`
        days, including today. Exactly `days` points are returned, oldest
        first; days without activity are included with zero counts.
        Resolution counts use the persisted resolution instant (updatedAt of
        findings currently in status resolved); intermediate re-resolutions
        are not historically trackable (no status history).
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
          description: >-
            Number of UTC calendar days to include, counting back from today
            (inclusive). Values outside 1..90 are rejected with 400.
      responses:
        "200":
          description: Daily trend points (oldest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceTrend"
        "400":
          description: days outside the allowed range (1..90)
        "401":
          description: Missing or invalid session
  /activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Get recent compliance activity
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /findings:
    get:
      operationId: listFindings
      tags: [findings]
      summary: List privacy findings
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in_review, resolved]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Finding"
  /findings/{id}:
    patch:
      operationId: updateFinding
      tags: [findings]
      summary: Update a finding status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingUpdate"
      responses:
        "200":
          description: Updated finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "404":
          description: Finding not found
  /sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: List monitored data sources
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSource"
    post:
      operationId: createSource
      tags: [sources]
      summary: Create a data source
      description: >-
        Admin only. The connection password is WRITE-ONLY: it is encrypted at
        rest and never returned in any response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceCreate"
      responses:
        "201":
          description: Created data source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "400":
          description: Invalid body
  /sources/{id}:
    get:
      operationId: getSource
      tags: [sources]
      summary: Get a data source by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Data source detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "404":
          description: Source not found
    patch:
      operationId: updateSource
      tags: [sources]
      summary: Update a data source
      description: >-
        Admin only. Update a data source's metadata or store a new connection
        configuration (encrypted). Password remains write-only on update as
        well.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceUpdate"
      responses:
        "200":
          description: Updated data source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "404":
          description: Source not found
    delete:
      operationId: deleteSource
      tags: [sources]
      summary: Delete a data source
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Source deleted
        "404":
          description: Source not found
  /sources/{id}/schedule:
    get:
      operationId: getSourceSchedule
      tags: [sources]
      summary: Get the scan schedule of a data source
      description: >-
        Returns the scan schedule for a source. When no schedule exists yet, a
        default disabled schedule (intervalMinutes 1440) is returned.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scan schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSchedule"
        "404":
          description: Source not found
    put:
      operationId: updateSourceSchedule
      tags: [sources]
      summary: Create or update the scan schedule of a data source
      description: >-
        Admin only. Upsert the scan schedule of a source. When enabled is true,
        intervalMinutes is required (400 when missing or out of range
        15-10080). Enabling sets nextRunAt to now + intervalMinutes. Backend
        enforces this rule (M10.5).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceScheduleUpdate"
      responses:
        "200":
          description: Updated scan schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSchedule"
        "400":
          description: Invalid schedule input
        "404":
          description: Source not found
  /rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List detection rules
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Detection rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
  /scans:
    get:
      operationId: listScans
      tags: [sources]
      summary: List scan history
      description: >-
        Scan executions, newest first. `status=queued` is accepted but never
        returned (no scan is ever created in queued state).
      parameters:
        - name: sourceId
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [queued, running, completed, failed] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Scan history (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"
    post:
      operationId: startScan
      tags: [sources]
      summary: Start a privacy scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "202":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "409":
          description: A scan is already running for this source
  /scans/{id}:
    get:
      operationId: getScan
      tags: [sources]
      summary: Get one scan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scan detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Scan not found
  /scans/{id}/cancel:
    post:
      operationId: cancelScan
      tags: [sources]
      summary: Request cooperative cancellation of a running scan
      description: >-
        Admin only. Sets the cancellation flag; the scanner stops at its next
        yield point (within one heartbeat interval) and finalizes as `failed`
        (reason `cancelled`). Idempotent while the scan is still running;
        409 once the scan reached a terminal state on its own.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Cancellation requested (scan still running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Scan not found
        "409":
          description: Scan already reached a terminal state
  /rules/{id}:
    patch:
      operationId: updateRule
      tags: [rules]
      summary: Update a detection rule (admin only)
      description: |
        FASE 7.0.5: actualiza únicamente el campo `enabled` de una regla.
        Solo este campo es gobernable desde la API; el resto (patrón, severidad,
        regulación) es built-in. El cambio es efectivo en el siguiente scan.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: Invalid input
        "401":
          description: Authentication required
        "403":
          description: Admin role required
        "404":
          description: Rule not found
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List audit reports
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Audit reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Generate an audit report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a single audit report
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Audit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Report not found
  /reports/{id}/download:
    get:
      operationId: downloadReport
      tags: [reports]
      summary: Download an audit report as JSON attachment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Report JSON payload delivered as a downloadable attachment
          headers:
            Content-Disposition:
              description: Instructs the browser to download the response as a file
              schema: { type: string, example: 'attachment; filename="report-r001.json"' }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Report not found

  /masking/preview:
    post:
      operationId: previewMasking
      tags: [masking]
      summary: Preview anonymization for test data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaskingInput"
      responses:
        "200":
          description: Masked data preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaskingPreview"

  /masking/jobs:
    get:
      operationId: listMaskingJobs
      tags: [masking]
      summary: List masking jobs
      description: >-
        Masking jobs, newest first. Same pagination pattern as the other list
        endpoints (limit default 50, max 100; offset >= 0).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Masking jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaskingJob"
        "401":
          description: Authentication required
    post:
      operationId: createMaskingJob
      tags: [masking]
      summary: Create a masking job (admin only)
      description: >-
        Generates an anonymized dataset for the given source, tokenizing the
        requested fields deterministically: same value + same key always yields
        the same token, preserving the original format.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaskingInput"
      responses:
        "201":
          description: Masking job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaskingJob"
        "400":
          description: Invalid input
        "401":
          description: Authentication required
        "403":
          description: Admin role required
        "404":
          description: Source not found
  /masking/jobs/{id}:
    get:
      operationId: getMaskingJob
      tags: [masking]
      summary: Get a single masking job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Masking job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaskingJob"
        "404":
          description: Masking job not found
  /masking/jobs/{id}/download:
    get:
      operationId: downloadMaskingJob
      tags: [masking]
      summary: Download an anonymized dataset as JSON attachment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Anonymized dataset delivered as a downloadable attachment
          headers:
            Content-Disposition:
              description: Instructs the browser to download the response as a file
              schema: { type: string, example: 'attachment; filename="masking-job-mj_001.json"' }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaskingDataset"
        "404":
          description: Masking job not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthLoginInput:
      oneOf:
        - $ref: "#/components/schemas/BootstrapLoginInput"
        - $ref: "#/components/schemas/LocalLoginInput"
    BootstrapLoginInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
    LocalLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: User email (normalized to lowercase server-side)
        password: { type: string, minLength: 1 }
    PasswordChangeInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 12 }
    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: User email (normalized to lowercase server-side)
        password: { type: string, minLength: 12 }
        name: { type: string }
    SessionSummary:
      type: object
      required: [jti, createdAt, expiresAt, current]
      description: Metadata of a single active session (never exposes secrets).
      properties:
        jti:
          type: string
          description: Session allowlist identifier (UUID).
        createdAt:
          type: string
          format: date-time
          description: When the session was issued (issued_at).
        expiresAt:
          type: string
          format: date-time
          description: Session expiration (mirrors JWT exp).
        current:
          type: boolean
          description: "True when this session is the one making the request."
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
    AuthUser:
      type: object
      required: [sub, roles]
      properties:
        sub: { type: string }
        email: { type: ["string", "null"] }
        roles:
          type: array
          items: { type: string }
    AdminUser:
      type: object
      description: Safe projection for administration (never includes credentials)
      required: [sub, email, roles, createdAt]
      properties:
        sub: { type: string }
        email: { type: string }
        name: { type: ["string", "null"] }
        roles:
          type: array
          items: { type: string, enum: [admin, auditor] }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: ["string", "null"], format: date-time }
    UserUpdateInput:
      type: object
      description: Only email and name are admin-editable; sub is immutable
      properties:
        email:
          type: string
          description: New email (normalized to lowercase server-side)
        name: { type: ["string", "null"] }
    RolesUpdateInput:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string, enum: [admin, auditor] }
          description: Full replacement set; roles are backend-authoritative
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required: [complianceScore, openFindings, criticalFindings, protectedRecords, monitoredSources, lastScanAt, scanStatus, findingsBySeverity]
      properties:
        complianceScore: { type: number }
        openFindings: { type: number }
        criticalFindings: { type: number }
        protectedRecords: { type: number }
        monitoredSources: { type: number }
        lastScanAt: { type: string }
        scanStatus: { type: string, enum: [monitoring, scanning, paused] }
        findingsBySeverity:
          type: object
          required: [critical, high, medium, low]
          properties:
            critical: { type: number }
            high: { type: number }
            medium: { type: number }
            low: { type: number }
    Activity:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [finding, scan, masking, report, system] }
        title: { type: string }
        description: { type: string }
        createdAt: { type: string }
        severity: { type: ["string", "null"], enum: [critical, high, medium, low, null] }
    Finding:
      type: object
      required: [id, title, dataType, source, location, severity, status, records, detectedAt, regulation, recommendation]
      properties:
        id: { type: string }
        title: { type: string }
        dataType: { type: string, enum: [email, phone, national_id, credit_card, health, address, password] }
        source: { type: string }
        location: { type: string }
        severity: { type: string, enum: [critical, high, medium, low] }
        status: { type: string, enum: [open, in_review, resolved] }
        records: { type: number }
        detectedAt: { type: string }
        regulation: { type: string }
        recommendation: { type: string }
        sample: { type: ["string", "null"] }
    FindingUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, in_review, resolved] }
    DataSource:
      type: object
      required: [id, name, kind, environment, status, lastScanAt, tables, records, findings]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [postgresql, mysql, mongodb, snowflake, bigquery] }
        environment: { type: string, enum: [production, staging, development] }
        status: { type: string, enum: [healthy, warning, offline] }
        lastScanAt: { type: string }
        tables: { type: number }
        records: { type: number }
        findings: { type: number }
    SourceConnectionInput:
      type: object
      description: >-
        Database connection credentials for an external source. The password is
        write-only: it is encrypted at rest and never returned in any response.
      required: [host, port, database, user, password]
      properties:
        host:
          type: string
          description: Database host (hostname or IP)
          minLength: 1
          maxLength: 253
        port:
          type: integer
          description: Database port (1-65535)
          minimum: 1
          maximum: 65535
        database:
          type: string
          description: Database name
          minLength: 1
          maxLength: 128
        user:
          type: string
          description: Username for authentication
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          description: Password (write-only, never returned in responses)
          minLength: 1
          maxLength: 256
        schema:
          type: string
          description: Database schema (optional)
          maxLength: 128
    SourceCreate:
      type: object
      required: [name, kind, environment]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          enum: [postgresql, mysql, mongodb, snowflake, bigquery]
        environment:
          type: string
          enum: [production, staging, development]
        connection:
          $ref: "#/components/schemas/SourceConnectionInput"
          description: >-
            Optional connection credentials. When omitted, the source is
            created without credentials (connectionConfig = null) and is not
            scannable until configuration is provided via PATCH.
    SourceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          enum: [postgresql, mysql, mongodb, snowflake, bigquery]
        environment:
          type: string
          enum: [production, staging, development]
        connection:
          $ref: "#/components/schemas/SourceConnectionInput"
          description: >-
            New connection configuration to store (encrypted). Omit to keep the
            existing configuration.
    ComplianceSummary:
      type: object
      required: [complianceScore, openFindings, findingsBySeverity, findingsByDataType, findingsBySource]
      properties:
        complianceScore:
          type: number
          description: >-
            Score computed exclusively by computeComplianceScore (single
            source of policy; currently 100 with zero open findings, 0
            otherwise). Always present, 0..100.
        openFindings:
          type: number
          description: Count of canonical active findings (status <> 'resolved' AND superseded = false).
        findingsBySeverity:
          type: object
          required: [critical, high, medium, low]
          properties:
            critical: { type: number }
            high: { type: number }
            medium: { type: number }
            low: { type: number }
          description: >-
            Active canonical findings by severity. All four keys are always
            present (0 when empty) — same convention as Dashboard.
        findingsByDataType:
          type: object
          additionalProperties:
            type: number
          description: >-
            Active canonical findings grouped by dataType. Keys come from the
            Finding.dataType enum (email, phone, national_id, credit_card,
            health, address, password); only dataTypes with at least one
            active finding appear. Empty object when there are no active
            findings. Named byDataType, never byRule — no finding→rule
            relation is persisted; per-rule metrics are a later phase if that
            relation is ever persisted.
        findingsBySource:
          type: array
          items:
            type: object
            required: [sourceId, sourceName, openFindings]
            properties:
              sourceId: { type: string }
              sourceName: { type: string }
              openFindings: { type: number }
          description: >-
            Active canonical findings grouped by source. Findings whose
            source was deleted (sourceId NULL) are EXCLUDED — no "unknown"
            bucket; their historical attribution survives in sourceName but
            they do not appear here. Ordered by openFindings DESC, then
            sourceName ASC (deterministic). Not paginated: acceptable at the
            current scale of monitored sources (documented decision).
    ComplianceTrend:
      type: object
      required: [days, points]
      properties:
        days:
          type: number
          description: The effective number of days in the response (equals the requested days, or the default 30).
        points:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceTrendPoint"
          description: Exactly `days` points, one per UTC calendar day, oldest first.
    ComplianceTrendPoint:
      type: object
      required: [date, newFindings, resolvedFindings, completedScans, recordsScanned]
      properties:
        date:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: >-
            UTC calendar day (YYYY-MM-DD). Deliberately not a date-time:
            bucket identity, no timezone ambiguity.
        newFindings:
          type: number
          description: Canonical findings (superseded = false) whose firstSeenAt falls on this UTC day.
        resolvedFindings:
          type: number
          description: >-
            Findings currently in status 'resolved' whose updatedAt falls on
            this UTC day. updatedAt is the persisted resolution instant for
            resolved rows (the only write that leaves a row in resolved).
            Under the current model a row can only contribute its latest
            resolution (no status history by design).
        completedScans:
          type: number
          description: Scans with status 'completed' whose completedAt falls on this UTC day.
        recordsScanned:
          type: number
          description: Sum of recordsRead of the completed scans attributed to this day (completedAt).
    SourceDetail:
      type: object
      required: [id, name, kind, environment, status, lastScanAt, tables, records, findings, scannable]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        environment: { type: string }
        status: { type: string }
        lastScanAt: { type: ["string", "null"] }
        tables: { type: number }
        records: { type: number }
        findings: { type: number }
        scannable:
          type: boolean
          description: Whether this source has connection configuration and can be scanned
    Rule:
      type: object
      required: [id, name, category, regulation, enabled, detections, lastTriggered]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        regulation: { type: string }
        enabled: { type: boolean }
        detections: { type: number }
        lastTriggered: { type: string }
    RuleInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
      description: |
        FASE 7.0.5: solo el campo `enabled` es gobernable desde la API.
        El resto (patrón, severidad, regulación) es built-in.
    ScanInput:
      type: object
      required: [sourceId]
      properties:
        sourceId: { type: string }
    SourceSchedule:
      type: object
      required: [sourceId, enabled, intervalMinutes]
      properties:
        sourceId: { type: string }
        enabled: { type: boolean }
        intervalMinutes: { type: number, minimum: 15, maximum: 10080 }
        nextRunAt: { type: ["string", "null"] }
        lastRunAt: { type: ["string", "null"] }
        lastStatus: { type: ["string", "null"], enum: [ok, skipped, error] }
    SourceScheduleUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        intervalMinutes: { type: number, minimum: 15, maximum: 10080 }
    Scan:
      type: object
      required: [id, sourceId, status, startedAt, tablesScanned, recordsRead]
      properties:
        id: { type: string }
        sourceId: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        startedAt: { type: string }
        completedAt: { type: ["string", "null"] }
        findingsCreated: { type: number }
        tablesScanned: { type: number }
        recordsRead: { type: number }
    ReportInput:
      type: object
      required: [name, period]
      properties:
        name: { type: string }
        period: { type: string, enum: [last_24h, last_7d, last_30d, quarter] }
    Report:
      type: object
      required: [id, name, period, status, createdAt, findings, complianceScore]
      properties:
        id: { type: string }
        name: { type: string }
        period: { type: string }
        status: { type: string, enum: [generating, ready] }
        createdAt: { type: string }
        findings: { type: number }
        complianceScore: { type: number }
        format: { type: string, enum: [pdf, csv] }
    MaskingInput:
      type: object
      required: [sourceId, fields]
      properties:
        sourceId: { type: string }
        fields:
          type: array
          items: { type: string }
    MaskingPreview:
      type: object
      required: [sourceId, records, maskedFields, rows]
      properties:
        sourceId: { type: string }
        records: { type: number }
        maskedFields:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/MaskingRow"
    MaskingRow:
      type: object
      additionalProperties:
        type: string
      description: >-
        One anonymized record as a flat object keyed by column name. Values are
        strings (non-string payloads are stringified before masking).
    MaskingJob:
      type: object
      required: [id, sourceId, fields, status, createdAt]
      properties:
        id: { type: string }
        sourceId: { type: string }
        fields:
          type: array
          items: { type: string }
        status: { type: string, enum: [queued, running, ready, failed] }
        createdAt: { type: string }
        completedAt: { type: ["string", "null"] }
        records: { type: number }
        error: { type: ["string", "null"] }
      description: >-
        Job de anonimización: tokeniza los campos solicitados de una fuente con
        tokenización determinista (mismo valor + misma clave = mismo token).
        `records` acumula los registros procesados; solo es definitivo cuando
        status = `ready`.
    MaskingDataset:
      type: object
      required: [jobId, records, fields, rows]
      properties:
        jobId: { type: string }
        records: { type: number }
        fields:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/MaskingRow"
    AuditEvent:
      type: object
      description: >-
        Evento de auditoría administrativa (M17): quién hizo qué, cuándo y
        sobre qué recurso. Historia deliberadamente desacoplada de `users`
        (sin foreign key): sobrevive al borrado de la cuenta referenciada en
        `actorUserId`. La acción y el tipo de recurso son texto libre con
        vocabulario cerrado en la capa de dominio.
      required: [id, action, resourceType, result, createdAt]
      properties:
        id: { type: string }
        actorUserId:
          type: [string, "null"]
          description: >-
            `sub` del actor autenticado que ejecutó la acción; `null` en
            acciones internas (scheduler de escaneos, recovery de scans
            huérfanos) donde no hay usuario humano.
        action:
          type: string
          description: >-
            Acción registrada. Vocabulario: login_success, login_failure,
            logout, logout_all, session_revoked, password_changed,
            user_updated, user_roles_updated, source_created, source_updated,
            source_deleted, schedule_created, schedule_updated,
            schedule_enabled, schedule_disabled, scan_started, scan_cancelled,
            scan_failed, report_created, report_downloaded,
            masking_job_created, dataset_downloaded, rule_enabled,
            rule_disabled.
        resourceType:
          type: string
          description: >-
            Tipo de recurso afectado: session, user, source, schedule, scan,
            report, masking_job o rule.
        resourceId:
          type: [string, "null"]
          description: Identificador del recurso afectado (`null` si no aplica).
        result:
          type: string
          enum: [success, failure]
          description: Resultado de la acción intentada.
        requestId:
          type: [string, "null"]
          description: >-
            Correlation id del request (M16, header `X-Request-Id`); `null` en
            acciones internas sin request HTTP.
        metadata:
          type: object
          additionalProperties: true
          description: >-
            Información operacional segura (ids, contadores, tipos, estados,
            nombres de campos). NUNCA contraseñas, JWT, cookies, tokens CSRF,
            claves de cifrado, credenciales de conexión ni datos descubiertos
            por los scans.
        createdAt: { type: string, format: date-time }

