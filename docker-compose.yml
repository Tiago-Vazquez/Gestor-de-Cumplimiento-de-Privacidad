# M12 — despliegue local: PostgreSQL + API + frontend (nginx).
# Arranque:  db (healthy) -> migrate (one-shot) -> api -> web.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-privacy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privacy-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-privacy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-privacy} -d $${POSTGRES_DB:-privacy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # M12 — migraciones como job one-shot (no dentro de cada réplica del API).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrate
    command: ["pnpm", "--filter", "@workspace/db", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-privacy}:${POSTGRES_PASSWORD:-privacy-dev-only}@db:5432/${POSTGRES_DB:-privacy}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "5000"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-privacy}:${POSTGRES_PASSWORD:-privacy-dev-only}@db:5432/${POSTGRES_DB:-privacy}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio (openssl rand -base64 48)}
      SOURCE_ENCRYPTION_KEY: ${SOURCE_ENCRYPTION_KEY:?SOURCE_ENCRYPTION_KEY es obligatorio (>= 32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      AUTH_RATE_LIMIT_STORE: ${AUTH_RATE_LIMIT_STORE:-memory}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-false}
      AUTH_BOOTSTRAP_ENABLED: ${AUTH_BOOTSTRAP_ENABLED:-false}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SCAN_SCHEDULER_TICK_MS: ${SCAN_SCHEDULER_TICK_MS:-60000}
      SCAN_SCHEDULER_BATCH: ${SCAN_SCHEDULER_BATCH:-5}
      # M20.2-A — el SPA lo sirve nginx (servicio `web`); la API no monta
      # estáticos ni loguea el warning "Compiled frontend not found".
      SERVE_STATIC: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/livez').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    # M20.2-B — healthcheck explícito del frontal contra su propio /healthz
    # (resuelto por nginx localmente, sin depender del API).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata:
