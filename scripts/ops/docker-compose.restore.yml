name: m24-restore

services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${RESTORE_POSTGRES_USER:-restore_admin}
      POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:?RESTORE_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${RESTORE_POSTGRES_DB:-privacy_restore}
    volumes:
      - restore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  migrate:
    image: ${RESTORE_MIGRATE_IMAGE:-m24-restore-migrate}
    build:
      context: ../..
      dockerfile: Dockerfile.api
      target: migrate
    command: ["sh", "-c", "pnpm --filter @workspace/db run db:migrate && pnpm --filter @workspace/db run db:provision-roles"]
    environment:
      ADMIN_DATABASE_URL: postgresql://${RESTORE_POSTGRES_USER:-restore_admin}:${RESTORE_POSTGRES_PASSWORD}@db:5432/${RESTORE_POSTGRES_DB:-privacy_restore}
      APP_ROLE_PASSWORD: ${RESTORE_APP_ROLE_PASSWORD:?RESTORE_APP_ROLE_PASSWORD is required}
      BG_ROLE_PASSWORD: ${RESTORE_BG_ROLE_PASSWORD:?RESTORE_BG_ROLE_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${RESTORE_API_IMAGE:-m24-restore-api}
    build:
      context: ../..
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: "5000"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://app_role:${RESTORE_APP_ROLE_PASSWORD}@db:5432/${RESTORE_POSTGRES_DB:-privacy_restore}
      BG_DATABASE_URL: postgresql://bg_role:${RESTORE_BG_ROLE_PASSWORD}@db:5432/${RESTORE_POSTGRES_DB:-privacy_restore}
      JWT_SECRET: ${RESTORE_JWT_SECRET:?RESTORE_JWT_SECRET is required}
      SOURCE_ENCRYPTION_KEY: ${RESTORE_SOURCE_ENCRYPTION_KEY:?RESTORE_SOURCE_ENCRYPTION_KEY is required}
      CORS_ORIGINS: ""
      TRUST_PROXY: "false"
      AUTH_RATE_LIMIT_STORE: memory
      AUTH_REGISTRATION_ENABLED: "false"
      HEALTHCHECK_DB: "true"
      SCAN_SCHEDULER_TICK_MS: "60000"
      SCAN_SCHEDULER_BATCH: "5"
      SERVE_STATIC: "false"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${RESTORE_API_PORT:-18080}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  restore_pgdata:
